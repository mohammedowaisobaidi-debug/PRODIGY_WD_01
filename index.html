<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stopwatch</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #4a00e0, #8e2de2);
      font-family: Arial, sans-serif;
      color: white;
    }

    .container {
      text-align: center;
      background: rgba(255, 255, 255, 0.1);
      padding: 30px 40px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    .time {
      font-size: 48px;
      margin-bottom: 20px;
      letter-spacing: 2px;
    }

    .buttons button {
      margin: 5px;
      padding: 10px 20px;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    .start { background: #00c853; color: white; }
    .pause { background: #ffab00; color: white; }
    .reset { background: #d50000; color: white; }
    .lap   { background: #2962ff; color: white; }

    button:hover {
      transform: scale(1.05);
      opacity: 0.9;
    }

    ul {
      margin-top: 20px;
      padding: 0;
      list-style: none;
      max-height: 150px;
      overflow-y: auto;
    }

    li {
      padding: 5px;
      border-bottom: 1px solid rgba(255,255,255,0.2);
    }
  </style>
</head>
<body>

<div class="container">
  <div class="time" id="display">00:00:00</div>

  <div class="buttons">
    <button class="start" onclick="start()">Start</button>
    <button class="pause" onclick="pause()">Pause</button>
    <button class="reset" onclick="reset()">Reset</button>
    <button class="lap" onclick="lap()">Lap</button>
  </div>

  <ul id="laps"></ul>
</div>

<script>
  let timer = null;
  let seconds = 0;

  function formatTime(sec) {
    let hrs = Math.floor(sec / 3600);
    let mins = Math.floor((sec % 3600) / 60);
    let secs = sec % 60;

    return (
      String(hrs).padStart(2, '0') + ":" +
      String(mins).padStart(2, '0') + ":" +
      String(secs).padStart(2, '0')
    );
  }

  function updateDisplay() {
    document.getElementById("display").innerText = formatTime(seconds);
  }

  function start() {
    if (timer !== null) return;
    timer = setInterval(() => {
      seconds++;
      updateDisplay();
    }, 1000);
  }

  function pause() {
    clearInterval(timer);
    timer = null;
  }

  function reset() {
    pause();
    seconds = 0;
    updateDisplay();
    document.getElementById("laps").innerHTML = "";
  }

  function lap() {
    if (seconds === 0) return;
    let li = document.createElement("li");
    li.innerText = formatTime(seconds);
    document.getElementById("laps").appendChild(li);
  }
</script>

</body>
</html>
